name: Last Impact Android debug
on:
  workflow_dispatch:
  push:
    branches: [r05-animation]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify character asset
        run: test -s assets/tripo/raze.glb
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Godot and templates
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://github.com/godotengine/godot-builds/releases/download/4.6-stable
          curl --fail --location --retry 3 "$BASE/Godot_v4.6-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6-stable_linux.x86_64
          echo /tmp/godot >> "$GITHUB_PATH"
          curl --fail --location --retry 3 "$BASE/Godot_v4.6-stable_export_templates.tpz" -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/godot_templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.stable"
          cp -a /tmp/godot_templates/templates/. "$HOME/.local/share/godot/export_templates/4.6.stable/"
      - name: Restore development signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: last-impact-debug-signing-v1
      - name: Install Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.1'
      - name: Configure SDK and debug signing
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/.android/sdk}}"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/build-tools/35.0.1/apksigner"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          fi
          cat > "$HOME/.config/godot/editor_settings-4.6.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey' >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android' >> "$GITHUB_ENV"
      - name: Import and check scripts
        run: |
          set -euo pipefail
          Godot_v4.6-stable_linux.x86_64 --headless --path . --editor --import 2>&1 | tee /tmp/import.log
          if grep -E 'Parse Error|SCRIPT ERROR|Failed to load script' /tmp/import.log; then exit 1; fi
          Godot_v4.6-stable_linux.x86_64 --headless --path . --quit-after 90 2>&1 | tee /tmp/smoke.log
          if grep -E 'SCRIPT ERROR|Parse Error|Invalid (call|access)' /tmp/smoke.log; then exit 1; fi
          timeout 90s Godot_v4.6-stable_linux.x86_64 --headless --path . --script res://tests/smoke.gd 2>&1 | tee /tmp/tests.log
          grep -F 'LAST IMPACT R05 SMOKE PASS' /tmp/tests.log
          if grep -E 'SCRIPT ERROR|Parse Error|TEST FAILED' /tmp/tests.log; then exit 1; fi
      - name: Export debug APK
        run: |
          set -euo pipefail
          mkdir -p build
          Godot_v4.6-stable_linux.x86_64 --headless --verbose --path . --export-debug Android build/LastImpact_R05.apk 2>&1 | tee /tmp/export.log
          test -s build/LastImpact_R05.apk
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose build/LastImpact_R05.apk
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging build/LastImpact_R05.apk | head -n 20 || true
          sha256sum build/LastImpact_R05.apk > build/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LastImpact_R05_Android
          path: |
            build/LastImpact_R05.apk
            build/SHA256SUMS.txt
          if-no-files-found: error
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LastImpact_R05_Diagnostico
          path: |
            /tmp/import.log
            /tmp/smoke.log
            /tmp/tests.log
            /tmp/export.log
          if-no-files-found: ignore
