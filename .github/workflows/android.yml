name: Last Impact Android debug
on:
  workflow_dispatch:
    inputs:
      export_apk:
        description: 'Export debug APK only after review'
        type: boolean
        default: false
  push:
    branches: [r0764-foot-contact]
  pull_request:
    branches: [r0763-gait-sync]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify character asset
        run: test -s assets/tripo/raze.glb
      - name: Convert IGNIS model to standard GLB
        run: |
          set -euo pipefail
          test -s assets/tripo/ignis_x1_source.glb
          npm install --prefix tools --no-save --no-package-lock meshoptimizer@0.23.0
          node tools/decode_ignis.mjs
          test -s assets/tripo/ignis_x1.glb
          rm -rf tools/node_modules
          rm assets/tripo/ignis_x1_source.glb
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Godot and templates
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://github.com/godotengine/godot-builds/releases/download/4.6-stable
          curl --fail --location --retry 3 "$BASE/Godot_v4.6-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6-stable_linux.x86_64
          echo /tmp/godot >> "$GITHUB_PATH"
          curl --fail --location --retry 3 "$BASE/Godot_v4.6-stable_export_templates.tpz" -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/godot_templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.stable"
          cp -a /tmp/godot_templates/templates/. "$HOME/.local/share/godot/export_templates/4.6.stable/"
      - name: Restore development signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: last-impact-debug-signing-v1
      - name: Install Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.1'
      - name: Configure SDK and debug signing
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/.android/sdk}}"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/build-tools/35.0.1/apksigner"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          fi
          cat > "$HOME/.config/godot/editor_settings-4.6.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey' >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android' >> "$GITHUB_ENV"
      - name: Import and check scripts
        run: |
          set -euo pipefail
          Godot_v4.6-stable_linux.x86_64 --headless --path . --editor --import 2>&1 | tee /tmp/import.log
          if grep -E 'Parse Error|SCRIPT ERROR|Failed to load script' /tmp/import.log; then exit 1; fi
          Godot_v4.6-stable_linux.x86_64 --headless --path . --quit-after 90 2>&1 | tee /tmp/smoke.log
          if grep -E 'SCRIPT ERROR|Parse Error|Invalid (call|access)' /tmp/smoke.log; then exit 1; fi
          timeout 90s Godot_v4.6-stable_linux.x86_64 --headless --path . --script res://tests/smoke.gd 2>&1 | tee /tmp/tests.log
          grep -F 'LAST IMPACT R073 SMOKE PASS' /tmp/tests.log
          timeout 90s Godot_v4.6-stable_linux.x86_64 --headless --path . --script res://tests/rig_audit.gd 2>&1 | tee /tmp/rig_audit.log
          grep -F 'RAZE RIG AUDIT COMPLETE' /tmp/rig_audit.log
          timeout 60s Godot_v4.6-stable_linux.x86_64 --headless --path . --script res://tests/retarget_math.gd 2>&1 | tee /tmp/retarget_math.log
          grep -F 'RETARGET ROTATION FIXTURES PASS' /tmp/retarget_math.log
          if grep -E 'SCRIPT ERROR|Parse Error|TEST FAILED' /tmp/rig_audit.log; then exit 1; fi
          timeout 90s Godot_v4.6-stable_linux.x86_64 --headless --path . --script res://tests/touch_qa.gd 2>&1 | tee /tmp/touch_tests.log
          grep -F 'LAST IMPACT TOUCH FIXTURES PASS' /tmp/touch_tests.log
          if grep -E 'SCRIPT ERROR|Parse Error|TEST FAILED' /tmp/touch_tests.log; then exit 1; fi
          if grep -E 'SCRIPT ERROR|Parse Error|TEST FAILED' /tmp/tests.log; then exit 1; fi
      - name: Audit verified CC0 animation source
        id: animation_source_audit
        run: |
          set -euo pipefail
          # Fetch only the pinned archive, never execute third-party repository scripts.
          GIT_LFS_SKIP_SMUDGE=1 git clone --no-checkout https://github.com/MightyBubble/Ludots-Assets.git /tmp/animation-source
          git -C /tmp/animation-source checkout fab331eff1cb9c552c60399ea10186ef675cd460
          git -C /tmp/animation-source lfs pull --include="animations/Quaternius-Universal-Animation-Library-Standard.zip" --exclude=""
          python3 tools/audit_animation_source.py /tmp/animation-source/animations/Quaternius-Universal-Animation-Library-Standard.zip /tmp/raze_rig_audit.json /tmp/animation_source_audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LastImpact_ANI02_SourceAudit
          path: |
            /tmp/raze_rig_audit.json
            /tmp/animation_source_audit.json
          if-no-files-found: ignore
      - name: Report animation research status
        if: always()
        run: echo 'ANI-02 source audit outcome=${{ steps.animation_source_audit.outcome }} (not a gameplay acceptance test)'
      - name: Experimental retarget preview on actual RAZE
        if: steps.animation_source_audit.outcome == 'success'
        id: retarget_preview
        run: |
          set -euo pipefail
          mkdir -p /tmp/lastimpact_retarget
          python3 - <<'PY'
          import zipfile,pathlib
          source=pathlib.Path('/tmp/animation-source/animations/Quaternius-Universal-Animation-Library-Standard.zip')
          with zipfile.ZipFile(source) as z:
              pathlib.Path('/tmp/ual_source.glb').write_bytes(z.read('Universal Animation Library[Standard]/Unreal-Godot/UAL1_Standard.glb'))
          PY
          LASTIMPACT_SAFE_RENDER=1 LIBGL_ALWAYS_SOFTWARE=1 timeout 120s xvfb-run -a Godot_v4.6-stable_linux.x86_64 --path . --rendering-method gl_compatibility --script res://tests/retarget_preview.gd 2>&1 | tee /tmp/lastimpact_retarget/preview.log
          grep -F 'RAZE RETARGET PREVIEW COMPLETE' /tmp/lastimpact_retarget/preview.log
          if grep -E 'SCRIPT ERROR|Parse Error|TEST FAILED' /tmp/lastimpact_retarget/preview.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LastImpact_ANI02_RetargetPreview
          path: /tmp/lastimpact_retarget/
          if-no-files-found: ignore
      - name: Package validated animation library and verify gameplay
        run: |
          set -euo pipefail
          test -s /tmp/lastimpact_retarget/raze_experimental.tres
          mkdir -p assets/animations
          cp /tmp/lastimpact_retarget/raze_experimental.tres assets/animations/raze_locomotion.tres
          timeout 90s Godot_v4.6-stable_linux.x86_64 --headless --path . --editor --import 2>&1 | tee /tmp/clip_import.log
          timeout 90s Godot_v4.6-stable_linux.x86_64 --headless --path . --script res://tests/clip_gameplay.gd 2>&1 | tee /tmp/clip_gameplay.log
          grep -F 'RAZE CLIP GAMEPLAY PASS' /tmp/clip_gameplay.log
          timeout 90s Godot_v4.6-stable_linux.x86_64 --headless --path . --script res://tests/gait_ab.gd 2>&1 | tee /tmp/gait_ab.log
          grep -F 'GAIT AB COMPLETE' /tmp/gait_ab.log
          if grep -E 'SCRIPT ERROR|Parse Error|TEST FAILED' /tmp/gait_ab.log; then exit 1; fi
          if grep -E 'SCRIPT ERROR|Parse Error|TEST FAILED' /tmp/clip_gameplay.log /tmp/clip_import.log; then exit 1; fi
      - name: Render desktop visual diagnostics
        run: |
          set -euo pipefail
          mkdir -p /tmp/lastimpact_visual
          command -v xvfb-run
          LIBGL_ALWAYS_SOFTWARE=1 timeout 180s xvfb-run -a Godot_v4.6-stable_linux.x86_64 --path . --rendering-method gl_compatibility --script res://tests/visual.gd 2>&1 | tee /tmp/visual.log
          grep -F 'VISUAL CAPTURE COMPLETE' /tmp/visual.log
          if grep -E 'SCRIPT ERROR|Parse Error|VISUAL CAPTURE FAILED|Shader compilation failed|SHADER ERROR|Program linking failed' /tmp/visual.log; then exit 1; fi
          test -s /tmp/lastimpact_visual/01_lobby.png
          test -s /tmp/lastimpact_visual/03_aim.png
          grep -F 'VISUAL MOTION COMPLETE' /tmp/visual.log
          test -s /tmp/lastimpact_visual/motion_walk_07.png
          test -s /tmp/lastimpact_visual/motion_turn_11.png
          test -s /tmp/lastimpact_visual/motion_reload_11.png
          test -s /tmp/lastimpact_visual/17_survival_start.png
          test -s /tmp/lastimpact_visual/19_survival_result.png
          test -s /tmp/lastimpact_visual/20_loot_nearby.png
          test -s /tmp/lastimpact_visual/21_inventory_collected.png
          test -s /tmp/lastimpact_visual/22_operator_model.png
          test -s /tmp/lastimpact_visual/23_operator_motion.png
          test -s /tmp/lastimpact_visual/24_frontier_overview.png
          test -s /tmp/lastimpact_visual/25_frontier_interior.png
          test -s /tmp/lastimpact_visual/26_storm_approaching.png
          test -s /tmp/lastimpact_visual/27_storm_exposure.png
          test -s /tmp/lastimpact_visual/28_storm_crown.png
          test -s /tmp/lastimpact_visual/storm_cross_00.png
          test -s /tmp/lastimpact_visual/storm_cross_01.png
          test -s /tmp/lastimpact_visual/storm_cross_02.png
      - name: Compare static draw batching in fixed camera
        run: |
          set -euo pipefail
          mkdir -p /tmp/lastimpact_batch_ab
          LASTIMPACT_SAFE_RENDER=1 LIBGL_ALWAYS_SOFTWARE=1 timeout 120s xvfb-run -a Godot_v4.6-stable_linux.x86_64 --path . --rendering-method gl_compatibility --script res://tests/static_batch_ab.gd 2>&1 | tee /tmp/lastimpact_batch_ab/metrics.log
          grep -F 'STATIC BATCH AB COMPLETE' /tmp/lastimpact_batch_ab/metrics.log
          if grep -E 'SCRIPT ERROR|Parse Error|TEST FAILED|SHADER ERROR' /tmp/lastimpact_batch_ab/metrics.log; then exit 1; fi
          test -s /tmp/lastimpact_batch_ab/legacy.png
          test -s /tmp/lastimpact_batch_ab/batched.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LastImpact_R0764_StaticAB
          path: /tmp/lastimpact_batch_ab/
          if-no-files-found: ignore
      - name: Render Android-safe material path
        run: |
          set -euo pipefail
          mkdir -p /tmp/lastimpact_visual_safe
          LASTIMPACT_SAFE_RENDER=1 LIBGL_ALWAYS_SOFTWARE=1 timeout 180s xvfb-run -a Godot_v4.6-stable_linux.x86_64 --path . --rendering-method gl_compatibility --script res://tests/safe_visual.gd 2>&1 | tee /tmp/safe_visual.log
          grep -F 'SAFE MATERIAL CAPTURE COMPLETE' /tmp/safe_visual.log
          test -s /tmp/lastimpact_visual_safe/03_safe_frontier.png
          test -s /tmp/lastimpact_visual_safe/04_safe_storm.png
          if grep -E 'SCRIPT ERROR|Parse Error|VISUAL CAPTURE FAILED|Shader compilation failed|SHADER ERROR|Program linking failed' /tmp/safe_visual.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LastImpact_R0764_SafeVisual
          path: /tmp/lastimpact_visual_safe/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LastImpact_R0764_Visual
          path: /tmp/lastimpact_visual/
          if-no-files-found: ignore
      - name: Prepare internal emulator APK (x86_64 only)
        run: |
          set -euo pipefail
          cp export_presets.cfg /tmp/export_presets.original.cfg
          trap 'cp /tmp/export_presets.original.cfg export_presets.cfg' EXIT
          sed -i 's@architectures/armeabi-v7a=true@architectures/armeabi-v7a=false@;s@architectures/arm64-v8a=true@architectures/arm64-v8a=false@;s@architectures/x86_64=false@architectures/x86_64=true@' export_presets.cfg
          Godot_v4.6-stable_linux.x86_64 --headless --path . --export-debug Android /tmp/lastimpact_android_qa.apk 2>&1 | tee /tmp/emulator_export.log
          test -s /tmp/lastimpact_android_qa.apk
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose /tmp/lastimpact_android_qa.apk
          unzip -l /tmp/lastimpact_android_qa.apk | grep 'lib/x86_64/libgodot_android.so'
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test installation and gameplay on Android emulator
        uses: reactivecircus/android-emulator-runner@v2.35.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swangle -noaudio -no-boot-anim -no-snapshot
          script: bash tools/android_qa.sh
      - name: Upload emulator diagnostics (not APK)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LastImpact_R0764_AndroidQA
          path: |
            /tmp/lastimpact_android_qa/
            /tmp/emulator_export.log
          if-no-files-found: ignore
      - name: Export debug APK
        if: ${{ success() }}
        run: |
          set -euo pipefail
          mkdir -p build
          Godot_v4.6-stable_linux.x86_64 --headless --verbose --path . --export-debug Android build/LastImpact_R076.apk 2>&1 | tee /tmp/export.log
          test -s build/LastImpact_R076.apk
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose build/LastImpact_R076.apk
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging build/LastImpact_R076.apk | head -n 20 || true
          unzip -l build/LastImpact_R076.apk > /tmp/arm-apk-contents.txt
          grep -F "lib/arm64-v8a/libgodot_android.so" /tmp/arm-apk-contents.txt
          grep -F "lib/armeabi-v7a/libgodot_android.so" /tmp/arm-apk-contents.txt
          sha256sum build/LastImpact_R076.apk > build/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: LastImpact_R0764_Android
          path: |
            build/LastImpact_R076.apk
            build/SHA256SUMS.txt
          if-no-files-found: error
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LastImpact_R0764_Diagnostico
          path: |
            /tmp/import.log
            /tmp/smoke.log
            /tmp/tests.log
            /tmp/rig_audit.log
            /tmp/retarget_math.log
            /tmp/clip_import.log
            /tmp/clip_gameplay.log
            /tmp/gait_ab.log
            /tmp/raze_rig_audit.json
            /tmp/touch_tests.log
            /tmp/export.log
            /tmp/visual.log
            /tmp/safe_visual.log
          if-no-files-found: ignore
