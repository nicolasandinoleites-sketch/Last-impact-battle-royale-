name: R0794 Android test APK
on:
  push:
    branches: [r0794-android-test]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify original assets
        run: |
          test -s assets/tripo/raze.glb
          test -s assets/tripo/ignis_x1.glb
          test -s assets/animations/raze_locomotion.tres
          test -s assets/deployment/aircraft_rig.glb
          test -s assets/deployment/jetpack_rig.glb
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Godot and templates
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://github.com/godotengine/godot-builds/releases/download/4.6-stable
          curl --fail --location --retry 3 "$BASE/Godot_v4.6-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6-stable_linux.x86_64
          echo /tmp/godot >> "$GITHUB_PATH"
          curl --fail --location --retry 3 "$BASE/Godot_v4.6-stable_export_templates.tpz" -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/godot_templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.6.stable"
          cp -a /tmp/godot_templates/templates/. "$HOME/.local/share/godot/export_templates/4.6.stable/"
      - name: Restore development signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: last-impact-debug-signing-v1
      - name: Install Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.1'
      - name: Configure SDK and debug signing
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/.android/sdk}}"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/build-tools/35.0.1/apksigner"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          fi
          cat > "$HOME/.config/godot/editor_settings-4.6.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey' >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android' >> "$GITHUB_ENV"
      - name: Import and test validated project
        run: |
          set -euo pipefail
          Godot_v4.6-stable_linux.x86_64 --headless --path . --editor --import 2>&1 | tee /tmp/import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/import.log; then exit 1; fi
          for test in vehicles frontier_expanded class_abilities gunsmith battle_supplies arsenal_loot impact_loot rival_combat rival_tactics rival_deployment rival_auto_reset deployment_r0783 smoke touch_qa clip_gameplay; do
            timeout 120s Godot_v4.6-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script "res://tests/$test.gd" 2>&1 | tee "/tmp/$test.log"
            if grep -E 'SCRIPT ERROR|Parse Error|Assertion failed|TEST FAILED' "/tmp/$test.log"; then exit 1; fi
          done
          grep -F 'R0794 VEHICLES PASS' /tmp/vehicles.log
      - name: Export signed Android test APK
        run: |
          set -euo pipefail
          mkdir -p build
          Godot_v4.6-stable_linux.x86_64 --headless --path . --export-debug Android build/LastImpact_R0794.apk 2>&1 | tee /tmp/export.log
          test -s build/LastImpact_R0794.apk
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose --print-certs build/LastImpact_R0794.apk
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging build/LastImpact_R0794.apk > build/APK_info.txt
          unzip -l build/LastImpact_R0794.apk > /tmp/apk_contents.txt
          grep -F 'lib/arm64-v8a/libgodot_android.so' /tmp/apk_contents.txt
          grep -F 'lib/armeabi-v7a/libgodot_android.so' /tmp/apk_contents.txt
          sha256sum build/LastImpact_R0794.apk > build/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LastImpact_R0794_Android
          path: build/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LastImpact_R0794_AndroidBuildLogs
          path: /tmp/*.log
          if-no-files-found: ignore
