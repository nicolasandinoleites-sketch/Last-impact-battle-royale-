name: Restore verified R0783 project
on:
  push:
    branches: [r0783-battle-royale]
    paths: ['asset_transfer/r0783/**', 'tools/restore_r0783_assets.py', '.github/workflows/r0783-restore.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Restore and verify all project files
        run: python3 tools/restore_r0783_assets.py
      - name: Archive complete project
        run: |
          mkdir -p /tmp/lastimpact-r0783
          python3 - <<'PY'
          import json,zipfile
          with zipfile.ZipFile('/tmp/lastimpact-r0783/LAST_IMPACT_R0783_GodotProject.zip','w',zipfile.ZIP_DEFLATED) as z:
              for e in json.load(open('asset_transfer/r0783/project_manifest.json')):
                  z.write(e['path'],e['path'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: LastImpact_R0783_CompleteGodotProject
          path: /tmp/lastimpact-r0783/
      - name: Commit restored binary files
        if: github.ref_name == 'r0783-battle-royale'
        run: |
          git config user.name "Last Impact build"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f assets/deployment/*.glb assets/deployment/*.jpg assets/tripo/ignis_x1.glb
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "R0783: restore exact verified binary assets"
          git push origin HEAD:refs/heads/r0783-battle-royale
