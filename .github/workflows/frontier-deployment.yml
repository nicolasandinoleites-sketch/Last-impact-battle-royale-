name: FRONTIER deployment integration QA
on:
  push:
    branches: [r0780-deployment-assets]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Decode weapon model
        run: |
          set -euo pipefail
          npm install --prefix tools --no-save --no-package-lock meshoptimizer@0.23.0
          node tools/decode_ignis.mjs
          test -s assets/tripo/ignis_x1.glb
          rm -rf tools/node_modules
          rm assets/tripo/ignis_x1_source.glb
      - name: Get Godot
        run: |
          curl --fail --location --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
      - name: Import project
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v4.6-stable_linux.x86_64 --headless --path . --editor --import 2>&1 | tee /tmp/import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/import.log; then exit 1; fi
      - name: Run fixtures
        run: |
          set -euo pipefail
          for fixture in deployment_flight deployment_surface deployment_camera frontier_deployment smoke; do
            timeout 120s /tmp/godot/Godot_v4.6-stable_linux.x86_64 --headless --path . --script "res://tests/$fixture.gd" 2>&1 | tee "/tmp/$fixture.log"
            if grep -E 'SCRIPT ERROR|Parse Error|Assertion failed|TEST FAILED' "/tmp/$fixture.log"; then exit 1; fi
          done
          grep -F 'DEPLOYMENT FLIGHT PASS' /tmp/deployment_flight.log
          grep -F 'DEPLOYMENT SURFACE PASS' /tmp/deployment_surface.log
          grep -F 'DEPLOYMENT CAMERA PASS' /tmp/deployment_camera.log
          grep -F 'FRONTIER DEPLOYMENT PASS' /tmp/frontier_deployment.log
          grep -F 'LAST IMPACT R073 SMOKE PASS' /tmp/smoke.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FrontierDeploymentQA
          path: |
            /tmp/import.log
            /tmp/deployment_flight.log
            /tmp/deployment_surface.log
            /tmp/deployment_camera.log
            /tmp/frontier_deployment.log
            /tmp/smoke.log
