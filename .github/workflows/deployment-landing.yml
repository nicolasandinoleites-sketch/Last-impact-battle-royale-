name: Deployment landing QA
on:
  push:
    branches: [r0777-frontier-landing]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  landing:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Get Godot 4.6
        run: |
          curl --fail --location --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
      - name: Run deployment regression and surface fixture
        run: |
          set -euo pipefail
          for fixture in deployment_flight deployment_surface; do
            timeout 60s /tmp/godot/Godot_v4.6-stable_linux.x86_64 --headless --path . --script "res://tests/$fixture.gd" 2>&1 | tee "/tmp/$fixture.log"
            if grep -E 'SCRIPT ERROR|Parse Error|Assertion failed' "/tmp/$fixture.log"; then exit 1; fi
          done
          grep -F 'DEPLOYMENT FLIGHT PASS' /tmp/deployment_flight.log
          grep -F 'DEPLOYMENT SURFACE PASS' /tmp/deployment_surface.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LastImpact_DeploymentSurfaceLogs
          path: /tmp/deployment_*.log
