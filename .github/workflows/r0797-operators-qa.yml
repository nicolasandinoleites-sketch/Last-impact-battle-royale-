name: R0794 Tactical rivals QA
on:
  push:
    branches: [r0797-operators]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  godot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check complete asset set
        run: |
          test -s assets/deployment/aircraft_rig.glb
          test -s assets/deployment/jetpack_rig.glb
          test -s assets/animations/raze_locomotion.tres
          test -s assets/tripo/raze.glb
          test -s assets/tripo/ignis_x1.glb
      - name: Get Godot 4.6
        run: |
          curl --fail --location --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
      - name: Import project
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v4.6-stable_linux.x86_64 --headless --path . --editor --import 2>&1 | tee /tmp/import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/import.log; then exit 1; fi
      - name: Run real deployment and regression fixtures
        run: |
          set -euo pipefail
          for test in operator_appearance hud_layout graphics_options vehicles frontier_expanded class_abilities gunsmith battle_supplies arsenal_loot impact_loot rival_combat rival_tactics rival_deployment rival_auto_reset deployment_r0783 smoke touch_qa clip_gameplay; do
            timeout 120s /tmp/godot/Godot_v4.6-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script "res://tests/$test.gd" 2>&1 | tee "/tmp/$test.log"
            if grep -E 'SCRIPT ERROR|Parse Error|Assertion failed|TEST FAILED' "/tmp/$test.log"; then exit 1; fi
          done
          grep -F 'R0797 APPEARANCE PASS' /tmp/operator_appearance.log
          grep -F 'R0796 HUD PASS' /tmp/hud_layout.log
          grep -F 'R0795 GRAPHICS PASS' /tmp/graphics_options.log
          grep -F 'R0794 VEHICLES PASS' /tmp/vehicles.log
          grep -F 'R0793 EXPANDED PASS' /tmp/frontier_expanded.log
          grep -F 'R0792 CLASSES PASS' /tmp/class_abilities.log
          grep -F 'R0791 GUNSMITH PASS' /tmp/gunsmith.log
          grep -F 'R0790 SUPPLIES PASS' /tmp/battle_supplies.log
          grep -F 'R0789 ARSENAL PASS' /tmp/arsenal_loot.log
          grep -F 'R0788 IMPACT LOOT PASS' /tmp/impact_loot.log
          grep -F 'R0786 COMBAT PASS' /tmp/rival_combat.log
          grep -F 'R0785 TACTICS PASS' /tmp/rival_tactics.log
          grep -F 'R0784 RIVAL DEPLOYMENT PASS' /tmp/rival_deployment.log
          grep -F 'R0784 AUTO RESET PASS' /tmp/rival_auto_reset.log
          grep -F 'R0783 DEPLOYMENT PASS' /tmp/deployment_r0783.log
          grep -F 'LAST IMPACT R073 SMOKE PASS' /tmp/smoke.log
          grep -F 'LAST IMPACT TOUCH FIXTURES PASS' /tmp/touch_qa.log
          grep -F 'RAZE CLIP GAMEPLAY PASS' /tmp/clip_gameplay.log
      - name: Archive full project source (without cache)
        if: always()
        run: |
          git archive --format=zip --output=/tmp/LAST_IMPACT_R0794_Source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LastImpact_R0794_QA
          path: /tmp/*.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LastImpact_R0794_CompleteProject
          path: /tmp/LAST_IMPACT_R0794_Source.zip
